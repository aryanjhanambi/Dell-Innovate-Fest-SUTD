<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jarvis pendant case — v1</title>
<style>
  body { margin: 0; background: #16161c; overflow: hidden; font-family: system-ui, sans-serif; }
  #info { position: fixed; top: 12px; left: 14px; color: #cbd0dc; font-size: 13px; line-height: 1.5; z-index: 10; }
  #info b { color: #fff; }
  #btn { position: fixed; top: 12px; right: 14px; z-index: 10; }
  button { background: #2a2a35; color: #cbd0dc; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<div id="info">
  <b>Jarvis pendant case — v1</b><br>
  body 23.4 × 19.8 × 26.6 mm (~half the old box)<br>
  drag = rotate · scroll = zoom · right-drag = pan
</div>
<div id="btn"><button id="toggle">toggle lid</button></div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16161c);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a48, 1.15));
const d1 = new THREE.DirectionalLight(0xffffff, 1.3); d1.position.set(1, 1.2, 1); scene.add(d1);
const d2 = new THREE.DirectionalLight(0x99aaff, 0.5); d2.position.set(-1, -0.6, -1); scene.add(d2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const loader = new STLLoader();
const group = new THREE.Group();
scene.add(group);
let lidMesh = null;

function add(url, color, opacity, isLid) {
  loader.load(url, g => {
    g.computeVertexNormals();
    const m = new THREE.MeshStandardMaterial({ color, metalness: 0.15, roughness: 0.55, transparent: opacity < 1, opacity });
    const mesh = new THREE.Mesh(g, m);
    group.add(mesh);
    if (isLid) lidMesh = mesh;
    fit();
  });
}
add('pendant_base.stl', 0x9fb0d0, 1.0, false);
add('pendant_lid.stl', 0xd98c8c, 0.6, true);

function fit() {
  const box = new THREE.Box3().setFromObject(group);
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c);
  camera.position.set(c.x + s * 0.8, c.y + s * 0.4, c.z + s * 0.9);
  camera.near = s / 100; camera.far = s * 10; camera.updateProjectionMatrix();
  controls.update();
}

document.getElementById('toggle').onclick = () => { if (lidMesh) lidMesh.visible = !lidMesh.visible; };
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
